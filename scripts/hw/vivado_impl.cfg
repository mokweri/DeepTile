# Vivado synthesis and implementation directives for timing closure.

[vivado]
# Alternative overall strategy:
# prop=run.impl_1.strategy=Performance_ExploreWithRemap

# Fine-grained implementation directives.
prop=run.impl_1.STEPS.OPT_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=ExtraTimingOpt
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore

# Synthesis directive.
prop=run.synth_1.STEPS.SYNTH_DESIGN.ARGS.DIRECTIVE=PerformanceOptimized

# HLS: Preserve explicit MAC activation-register replicas; merging them recreates
# a high-fanout activation net.
prop=run.synth_1.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-keep_equivalent_registers}

# VPL-generated runs do not expose STEPS.*.ARGS.JOBS as run properties. Set
# NJOBS through scripts/hw/Makefile instead.
