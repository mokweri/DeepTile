# Maps each tile_conv AXI master to a ZCU104 memory port.
#
# Kernel bundles:
#   gmem0 -> ifm
#   gmem1 -> weights
#   gmem2 -> biases
#   gmem3 -> out
#   gmem4 -> xfer_desc + comp_desc
#   gmem5 -> residual
#   gmem6 -> dw_weights
#
# Feature maps, weights, and output use separate HP ports. Bias, residual, and
# depthwise weights share HP2; descriptors share the HPC0 connection.

[connectivity]
nk=tile_conv:1:tile_conv_1

# IFM reads
sp=tile_conv_1.m_axi_gmem0:HP0

# Weight reads
sp=tile_conv_1.m_axi_gmem1:HP1

# Bias, residual, and depthwise reads
sp=tile_conv_1.m_axi_gmem2:HP2
sp=tile_conv_1.m_axi_gmem5:HP2
sp=tile_conv_1.m_axi_gmem6:HP2

# OFM writeback
sp=tile_conv_1.m_axi_gmem3:HP3

# Transfer and compute descriptors. HPC1 is unavailable on this platform.
sp=tile_conv_1.m_axi_gmem4:HPC0
