# DeepTile documentation site.
#
#   make -C scripts docs-serve    # live preview at http://127.0.0.1:8000
#   make -C scripts docs          # static site in build/docs/site
#
# Pages live in docs/. The C++ API reference is generated by Doxygen into
# docs/reference/api/ (ignored by Git) and served as static files.

site_name: DeepTile
site_description: Reusable INT8 CNN inference with fixed FPGA hardware and target-aware software.
site_author: Obed M. Mogaka, Håkan Forsberg, Masoud Daneshtalab
repo_url: https://github.com/mokweri/DeepTile
repo_name: mokweri/DeepTile
edit_uri: edit/main/docs/
copyright: DeepHERO Lab · Mälardalen University

docs_dir: docs
site_dir: build/docs/site

theme:
  name: material
  logo: assets/figures/deeptile-logo-dark.svg
  favicon: assets/figures/deeptile-logo-light.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Doxygen inputs and figure generators are sources, not pages.
exclude_docs: |
  doxygen/
  hooks/
  assets/figures/*.py
  requirements.txt

plugins:
  - search
  - include-markdown

# Links that leave docs/ are rewritten to the file on GitHub at this branch.
hooks:
  - docs/hooks/repo_links.py

extra:
  repo_branch: main

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Prepare the ZCU104: getting-started/board-setup.md
      - Quick start: getting-started/quick-start.md
  - Concepts:
      - How DeepTile works: concepts/how-it-works.md
      - Hardware architecture: concepts/hardware-architecture.md
      - Execution and timing: concepts/execution-and-timing.md
  - Guides:
      - Run a model: guides/run-a-model.md
      - Evaluate on a dataset: guides/evaluate-on-a-dataset.md
      - Bring your own model: guides/bring-your-own-model.md
      - Build a hardware target: guides/build-a-target.md
      - Port to another board: guides/port-to-another-board.md
      - Measure power and energy: guides/power-and-energy.md
      - Reproduce the paper results: guides/reproduce-results.md
  - Reference:
      - Supported operators: reference/operators.md
      - Command reference: reference/commands.md
      - Graph handoff specification: reference/graph-handoff-spec.md
      - TargetPackage: reference/target-package.md
      - Naming: reference/naming.md
      - C++ API: reference/api/index.html
  - Contributing:
      - Repository layout: contributing/repository-layout.md
      - Testing and validation: contributing/testing.md
  - Research: research.md
  - Author: author.md
